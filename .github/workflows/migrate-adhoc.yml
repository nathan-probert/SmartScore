# TEMPORARY: one-shot applier for the shot-columns migration, run by hand
# while this branch is in review. The standing migrate job (deploy.yml) only
# fires on main pushes / `deploy`-labelled PRs; this lets the owner apply the
# pending migrations to dev or prod ad hoc with the same sed+psql
# idempotent pattern. Remove once the standing pipeline carries the migration.
#
# Trigger is `push` (workflow_dispatch needs the file on the default branch).
# Scope: dev by default; a commit message containing "[prod]" switches the
# run to the prod tables. Re-pushing re-applies - every migration is
# idempotent, that is the repo's deploy contract.
name: migrate-adhoc
on:
  push:
    branches:
      - feat/supabase-shot-cols

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # dev unless the pushed commit message carries the [prod] marker.
      - name: Pick environment
        id: env-pick
        run: |
          if git log -1 --pretty=%s | grep -q "\[prod\]"; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply migrations
        env:
          ENV: ${{ steps.env-pick.outputs.env }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations in supabase/migrations/; nothing to apply."
            exit 0
          fi
          for file in $(printf '%s\n' "${files[@]}" | sort); do
            echo "Applying $file (ENV=$ENV)"
            sed "s/__ENV__/$ENV/g" "$file" \
              | psql -v ON_ERROR_STOP=1 --single-transaction "$DATABASE_URL"
          done
