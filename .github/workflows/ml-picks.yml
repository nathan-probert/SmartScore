name: ML Daily Picks

# Predict-only daily ML picks (Picks-{ENV}) - the replacement for the retired
# MLPicks Lambda/image surface. SAME inference path (the artifact -> Supabase
# read -> build_frame/add_derived -> ensemble rank-mean -> daily_picks ->
# the schema-safe Picks write in smartscore/scripts/backtrack/run_daily_picks.py
# (save_picks_db: probe-before-delete + restore-on-insert-failure), lifted
# verbatim from the former handler); $0.00 infra. docs/ml-picks-runbook.md.

on:
  schedule:
    # 05:30 ET-equivalent to the retired EventBridge trigger's cron 30 9.
    # DST caveat: GitHub cron is a FIXED UTC clock while the pipeline's
    # "today" is America/Toronto - 09:30 UTC is 05:30 EDT but 04:30 EST,
    # so the local wall-clock anchor shifts one hour across clock changes
    # (same accepted behaviour the template documented for its crons).
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date YYYY-MM-DD (default: ET-today)'
        required: false
        default: ''
      dry:
        description: 'Smoke run: assemble the picks, skip the Picks write'
        type: boolean
        required: false
        default: false
  # Architecture A: per-game kicks. AWS EventBridge stays the source of truth
  # for "when" - each per-game TriggerStateMachineAt_* rule (utility.py
  # schedule_run, game_start + ML_KICK_OFFSET_MIN) fires the MLPicksKick
  # Lambda, which repository_dispatches here. The nightly cron remains the
  # default full-day fallback pass, and this path is ADDITIVE.
  repository_dispatch:
    types: [ml-picks-game]

permissions:
  contents: read

# Picks writes are per-day upserts; serialize reruns rather than racing them.
concurrency:
  group: ml-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    # Refresh adds ~14 min worst case (dump load ~6 + current-season crawl ~8
    # when the HTTP cache missed a chunk; the nightly cron run itself is
    # still near that ceiling only at season start, well under it later),
    # 45 keeps a misbehaving crawl from hanging the job.
    timeout-minutes: 45
    env:
      ENV: prod
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Artifact-fact convention: whatever the last owner refresh pushed, under
      # the dated prefix read at run time (prefix predict/ml = both S3's
      # ML_ARTIFACT_PREFIX and Storage's ML_ARTIFACT_STORAGE_PREFIX).
      # DEFAULT source is SUPABASE STORAGE (ML_STORAGE_BUCKET bucket
      # `ml-artifacts`, PRIVATE bucket, read with the SUPABASE_* secrets the
      # job already needs - NO extra owner secret). The S3 read (ML_S3_BUCKET)
      # stays OPTIONAL for owner-side AWS setups. docs/ml-picks-runbook.md §2/§3
      ML_STORAGE_BUCKET: ${{ secrets.ML_STORAGE_BUCKET || 'ml-artifacts' }}
      ML_ARTIFACT_STORAGE_PREFIX: predict/ml
      ML_S3_BUCKET: ${{ secrets.ML_S3_BUCKET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Mirror of deploy.yml's deploy-job install (uv sync --no-dev, pinned
      # by uv.lock) - runtime deps only; lint/dev groups are not needed here.
      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # ---------------- Runner-side store refresh (exact-features path) ----
      # The 14 shot/TOI features are computed EXACTLY from the raw per-game
      # store (model.shot_features_from_games over player_games - see
      # run_daily_picks.derive_shot_block), so the store is rebuilt on the
      # runner BEFORE inference: (1) un-gzip the committed season dumps into
      # data/raw_nhl.sqlite (no credentials, no Supabase, no crawl); (2)
      # crawl THIS season's played games on cache-miss through the public
      # NHL endpoints via nhl_client (the store's --build mechanism; zero
      # Supabase). The dumps hold completed seasons only, so step (2) is
      # what makes today's block exact - a season's games cannot be in a
      # dump until the export/commit.
      #
      # data/cache (nhl_client's on-disk HTTP cache) is cached between runs:
      # box scores / shift charts / game logs are content-addressed per
      # game/player, so a warm cache re-fetches only newly FINAL games
      # (~2-5/day; ~165 around season start with a cold cache). It is NOT
      # the runner's own filesystem surviving anything - each job starts
      # with an empty checkout and this step's restore.
      - name: Resolve the slate date (ET) + cache key
        id: slate
        run: |
          D="${DISPATCH_DATE:-$(TZ=America/Toronto date +%F)}"
          echo "et_date=${D}" >> "$GITHUB_OUTPUT"
        env:
          DISPATCH_DATE: ${{ inputs.date || github.event.client_payload.date }}
      - name: Keep the NHL HTTP crawl cache between runs
        uses: actions/cache@v4
        with:
          path: data/cache
          key: nhl-crawl-${{ steps.slate.outputs.et_date }}
          # Any newer/older snapshot of the crawl cache beats a cold start;
          # refresh_store re-walks the season schedule (never trusts a warm
          # schedule file - the stale-schedule gotcha in
          # DAILY_DATA_RUNBOOK.md section 2), then serves only
          # already-fetched games from it.
          restore-keys: |
            nhl-crawl-
      - name: Rebuild the raw per-game store from the committed dumps
        run: uv run --frozen python smartscore/scripts/backtrack/dump_store.py --load
      # Warn-not-exit semantics: a crawl failure degrades, it does not kill
      # the picks pass - the store stays at the dumps' vintage and
      # run_daily_picks prints its ONE stale-store warning for the affected
      # game days (docs/ml-picks-runbook.md section 1.1) and continues.
      # --skip-load: the step above just loaded the dumps; refresh crawls
      # only (its guard still loads if the store went missing anyway), so a
      # pass pays the ~6 min dump load exactly once. A same-day second pass
      # repeats this chain; the dumps load re-truncates and rebuilds the
      # committed rows and the crawl re-upserts the season - idempotent,
      # never duplicating (COALESCE merge on (player_id, game_id)).
      - name: Incremental crawl of the current season (public NHL API)
        continue-on-error: true
        run: |
          uv run --frozen python smartscore/scripts/backtrack/refresh_store.py \
            --skip-load --through ${{ steps.slate.outputs.et_date }}

      # Artifact source step: the script resolves the artifact in this order
      # (docs/ml-picks-runbook.md §2): --artifact PATH (local file, always
      # wins) -> S3 bucket/prefix (only when ML_S3_BUCKET is configured AND
      # AWS credentials exist) -> Supabase Storage ML_STORAGE_BUCKET/prefix
      # (the DEFAULT here: same SUPABASE_* secrets this job already needs -
      # no AWS at all). If S3 is configured but its secrets are absent, the
      # run falls through to Storage automatically.
      # Steps 3+4: run_daily_picks fetches the artifact (Storage dated-prefix
      # latest by default) then performs inference via model.py + its
      # schema-safe Picks write (save_picks_db) - the same inference path the
      # handler ran.

      # Trigger-source resolution, workflow_dispatch semantics preserved:
      # explicit inputs.date/inputs.dry win; repository_dispatch (the
      # per-game kick) supplies client_payload {date, dry,
      # context: 'post-game-start'}. Multiple kicks per date are fine and
      # expected (one per game start): each is one extra idempotent pass -
      # the Picks write is a full wipe-then-reinsert of the same rows, so a
      # repeat pass for a date rewrites, not duplicates.
      # docs/ml-picks-runbook.md ("Per-game kick (A-architecture)").
      - name: Run the daily ML picks pass
        env:
          DISPATCH_DATE: ${{ inputs.date || github.event.client_payload.date }}
          DISPATCH_DRY: ${{ inputs.dry || github.event.client_payload.dry }}
        run: |
          ARGS=""
          if [ -n "${DISPATCH_DATE}" ]; then
            ARGS="${ARGS} --date ${DISPATCH_DATE}"
          fi
          if [ "${DISPATCH_DRY}" == "true" ]; then
            ARGS="${ARGS} --dry"
          fi
          echo "Trigger context: ${{ github.event_name }} (date:'${DISPATCH_DATE}' dry:'${DISPATCH_DRY}')"
          uv run --with lightgbm==4.7.0 python smartscore/scripts/backtrack/run_daily_picks.py ${ARGS}

      # Step 5: the script prints the single structured SMARTSCORE_ML_PICKS
      # log line and appends the headline to $GITHUB_STEP_SUMMARY; this step
      # surfaces the run verdict in the job log as well.
      - name: Job summary
        if: always()
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -s "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "ML picks run complete - see the job summary for the headline."
          else
            echo "ML picks run finished (no summary written: the pass did not reach job_summary)."
          fi
