name: ML Daily Picks

# Predict-only daily ML picks (Picks-{ENV}) - the replacement for the retired
# MLPicks Lambda/image surface. SAME inference path (the artifact -> Supabase
# read -> build_frame/add_derived -> ensemble rank-mean -> daily_picks) with
# the DEFAULT write mode stat_update in
# smartscore/scripts/backtrack/run_daily_picks.py: fill ONLY the stat column
# on the site's OWN full-slate Picks-{ENV} rows (no wipe, no insert; the
# top-3 challenge picks are log/summary output). The legacy wipe-then-publish
# the-3-picks REPLACE survives behind --write-mode legacy (save_picks_db);
# $0.00 infra. docs/ml-picks-runbook.md.

on:
  schedule:
    # 05:30 ET-equivalent to the retired EventBridge trigger's cron 30 9.
    # DST caveat: GitHub cron is a FIXED UTC clock while the pipeline's
    # "today" is America/Toronto - 09:30 UTC is 05:30 EDT but 04:30 EST,
    # so the local wall-clock anchor shifts one hour across clock changes
    # (same accepted behaviour the template documented for its crons).
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date YYYY-MM-DD (default: ET-today)'
        required: false
        default: ''
      dry:
        description: 'Smoke run: assemble the picks, skip the Picks write'
        type: boolean
        required: false
        default: false
      # Manual-dispatch override of the job-level ENV (below) - the fail-safe
      # default 'prod' means a dispatch that forgets the input still lands on
      # Picks-prod, never on a silent fallback. Scheduled and
      # repository_dispatch runs DO NOT read this input at all: they resolve
      # ONLY the job-level ENV: prod (the "Resolve the picks ENV" step), so a
      # cron run can never drift to dev. docs/ml-picks-runbook.md §1 (env matrix).
      environment:
        description: 'Picks table to write (dev|prod). Does NOT decide the LIVE-read source (that is `source`, default prod)'
        type: string
        required: false
        default: prod
      # The HYBRID axis: source splits the LIVE-read side from the write side.
      # `environment` keeps deciding the WRITE side (Picks-{environment});
      # `source` decides ONLY which LIVE snapshot TODAY's rows are read from
      # (Player-Snapshots-{source}, run_daily_picks --source-env). The default
      # is UNCONDITIONAL prod - even on an environment=dev write-mode run
      # (owner rule: prod is the source of truth for feature reads;
      # source=dev is the legacy override for dev-side testing). The nightly
      # cron and repository_dispatch runs resolve prod for BOTH axes (no
      # inputs read).
      # docs/ml-picks-runbook.md §1 (env matrix) + §10 (shared ledger).
      source:
        description: 'LIVE snapshot source env for TODAYS rows (dev|prod; default prod)'
        type: string
        required: false
        default: prod
      # The WRITE MODE: 'stat_update' (the DEFAULT and the workflow-pinned
      # value) fills ONLY the stat column on the site's OWN full-slate
      # Picks-{ENV} rows - no wipe, never inserting rows; the top-3 challenge
      # picks are log/summary OUTPUT. 'legacy' restores the old wipe-then-
      # publish-the-3-picks REPLACE. The script fails closed on anything else.
      # Scheduled and repository_dispatch runs do not read this input; they
      # get the pinned stat_update in the picks step's ARGS.
      write_mode:
        description: 'stat_update (default; stat column fill on the full slate) | legacy (wipe + 3 picks)'
        type: string
        required: false
        default: stat_update
  # Per-game kicks (race-fixed): each TriggerStateMachineAt_* rule
  # (utility.py schedule_run, game_start + PIPELINE_RESTART_OFFSET_MIN)
  # restarts the pipeline state machine, whose final KickMLPicks state
  # invokes the MLPicksKick Lambda - which repository_dispatches here, only
  # AFTER the run's SaveToDb/PublishToDb writes completed (so the pass never
  # reads stale groups). The nightly cron remains the default full-day
  # fallback pass, and this path is ADDITIVE.
  repository_dispatch:
    types: [ml-picks-game]

permissions:
  contents: read

# Picks writes are per-day upserts; serialize reruns rather than racing them.
concurrency:
  group: ml-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    # The picks pass is now narrow: one bounded gap-fill (a couple of NHL API
    # requests per missing completed day - rarely more than yesterday's slate)
    # + one artifact download + inference over published history. 45 min keeps
    # a pathological NHL API lag (a long missing-days gap, capped at 14) from
    # hanging the job; typical runs finish well under 10.
    timeout-minutes: 45
    env:
      # Scheduled + repository_dispatch runs resolve ONLY this job-level
      # default (schedule has no `inputs` path): prod, i.e. Picks-prod /
      # Player-Snapshots-prod / *-backtrack-prod. Manual workflow_dispatch
      # overrides it per-run via the `environment` input (WRITE side) and the
      # `source` input (LIVE-READ side) at the "Resolve the picks ENV +
      # SOURCE env" step (ENV: steps.picks_env.outputs.picks_env and
      # SOURCE_ENV: steps.picks_env.outputs.source_env on the picks step).
      # GitHub Actions sets job/step env in the PROCESS env before `python`
      # starts, so config.py's import-time read (config.ENV =
      # os.environ.get("ENV", "dev"), config.py:12) resolves it
      # unambiguously - no import-ordering hazard, no --env flag needed on
      # run_daily_picks (the LIVE-read side DOES take --source-env; the two
      # axes default to prod each, so the nightly is unchanged).
      # docs/ml-picks-runbook.md §1.
      ENV: prod
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Artifact-fact convention: whatever the last owner refresh pushed, under
      # the dated prefix read at run time (prefix predict/ml = both S3's
      # ML_ARTIFACT_PREFIX and Storage's ML_ARTIFACT_STORAGE_PREFIX).
      # DEFAULT source is SUPABASE STORAGE (ML_STORAGE_BUCKET bucket
      # `ml-artifacts`, PRIVATE bucket, read with the SUPABASE_* secrets the
      # job already needs - NO extra owner secret). The S3 read (ML_S3_BUCKET)
      # stays OPTIONAL for owner-side AWS setups. docs/ml-picks-runbook.md §2/§3
      ML_STORAGE_BUCKET: ${{ secrets.ML_STORAGE_BUCKET || 'ml-artifacts' }}
      ML_ARTIFACT_STORAGE_PREFIX: predict/ml
      ML_S3_BUCKET: ${{ secrets.ML_S3_BUCKET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Mirror of deploy.yml's deploy-job install (uv sync --no-dev, pinned
      # by uv.lock) - runtime deps only; lint/dev groups are not needed here.
      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # ---------------- Stage-2 gap-fill (published per-game raw columns) ----
      # The 14 shot/TOI features are recomputed EXACTLY at inference time from
      # the published per-game record in Supabase (run_daily_picks.
      # shot_block_from_history -> model.shot_features_from_games over the
      # stage-2 raw columns game_goals/game_shots/game_toi_min). This FIRST
      # step tops up any completed game days the nightly publish has not
      # covered yet - bounded: the schedule endpoint once per missing DAY
      # (typically exactly one: yesterday) plus one boxscore request per
      # FINAL game that day; NO season sweeps, no local store, no dumps.
      # Games in a non-terminal state (LIVE/FUT) are skipped - the
      # fetch_boxscore cache-hostage guard (backfill_missing_days.
      # TERMINAL_GAME_STATES) - and replayed on a later pass once final.
      # dry=true: the step runs READ-ONLY (fetch + log, no upserts) and the
      # inference pass below also skips its Picks write.
      # NOTE: this step needs the stage-2 DDL to have landed on
      # Player-Snapshots-backtrack-{env}; run_daily_picks fails loudly naming
      # 20261027_add_per_game_raw_columns_player_snapshots_backtrack.sql if
      # the columns are missing.
      - name: Resolve the slate date (ET)
        id: slate
        run: |
          D="${DISPATCH_DATE:-$(TZ=America/Toronto date +%F)}"
          echo "et_date=${D}" >> "$GITHUB_OUTPUT"
        env:
          DISPATCH_DATE: ${{ inputs.date || github.event.client_payload.date }}
      # ENV resolution - the safety-critical, fail-closed form:
      #  * scheduled + repository_dispatch runs (no dispatch input) resolve
      #    ONLY the job-level env: ENV: prod -> Picks-prod; no silent env
      #    default can land them on the wrong Picks table;
      #  * workflow_dispatch overrides via the `environment` input (default
      #    prod; set dev to write Picks-dev). The WRITE env never decides the
      #    LIVE-READ source ANYMORE: source defaults to 'prod'
      #    unconditionally even on a dev write-mode run (owner rule 2026-11-03:
      #    the -dev backtrack/live shells are empty and prod is the source of
      #    truth for feature reads - the old follow-the-write-env default
      #    silently read the empty Player-Snapshots-dev and clean-skipped).
      #    Only an EXPLICITLY set source input = 'dev' overrides (legacy
      #    dev-side live read for dev testing).
      #    `inputs.environment` is NOT referenced unconditionally: on a
      #    schedule event it resolves EMPTY, and an empty step-level ENV
      #    would override the job-level prod -> config.ENV's 'dev' fallback.
      #    Gated the other way round (empty -> job ENV), that cannot happen.
      #  * the resolved value is whitelisted dev|prod and echoed so the
      #    resolved write target is visible in the job log ("env: prod").
      #  * the SOURCE axis (inputs.source, default prod): which LIVE
      #    snapshot TODAY's rows are read from (Player-Snapshots-{source}).
      #    The in-step fallback is UNCONDITIONAL prod - `${DISPATCH_SOURCE:-prod}`
      #    never consults the write env (the owner's source-of-truth rule);
      #    an explicit source=dev input is the ONLY dev-live-read override.
      #    Scheduled + repository_dispatch resolve NO source input at all ->
      #    prod (nightly unchanged: BOTH axes prod). Whitelisted dev|prod,
      #    hard-failed otherwise, the same fail-closed form.
      # The step-level ENV below binds the SAME resolved value to both script
      # steps (GitHub Actions puts it in the process env before python
      # starts, so config.py's import-time read is unambiguous); SOURCE_ENV
      # rides only the picks step (the live-read side; the backfill step is
      # env-independent by the shared-ledger rule 027ef47).
      - name: 'Resolve the picks ENV (write side) + SOURCE env (live-read side)'
        id: picks_env
        env:
          DISPATCH_ENV: ${{ inputs.environment }}
          DISPATCH_SOURCE: ${{ inputs.source || github.event.client_payload.source }}
        run: |
          RESOLVED="${DISPATCH_ENV}"
          if [ -z "${RESOLVED}" ]; then
            RESOLVED="${ENV}"
          fi
          case "${RESOLVED}" in
            dev|prod) ;;
            *)
              echo "::error::environment must be dev or prod (got '${RESOLVED}')"
              exit 1 ;;
          esac
          # SOURCE axis: ${DISPATCH_SOURCE:-prod} - the fallback is
          # UNCONDITIONAL 'prod' (the write env NEVER decides the live read;
          # owner rule: prod is the source of truth for feature reads -
          # 2026-11-03, after the -dev backtrack/live shells were removed as
          # tables-of-record). An explicitly set source=dev dispatch input is
          # the only dev-live-read override. Schedule/kick runs dispatch no
          # source at all -> prod (nightly: BOTH axes prod, unchanged).
          SOURCE_RESOLVED="${DISPATCH_SOURCE:-prod}"
          case "${SOURCE_RESOLVED}" in
            dev|prod) ;;
            *)
              echo "::error::source must be dev or prod (got '${SOURCE_RESOLVED}')"
              exit 1 ;;
          esac
          echo "env: ${RESOLVED}"
          echo "source: ${SOURCE_RESOLVED}"
          echo "picks_env=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "source_env=${SOURCE_RESOLVED}" >> "$GITHUB_OUTPUT"
      - name: Backfill the last published date's missing completed game days (NHL API, bounded)
        env:
          DISPATCH_DRY: ${{ inputs.dry || github.event.client_payload.dry }}
          ENV: ${{ steps.picks_env.outputs.picks_env }}
        run: |
          # through YESTERDAY (ET): the picks pass's own first step re-invokes
          # the helper (backfill_missing_days.backfill) with the same window;
          # the per-date markers make the second call a no-op skip. Games on
          # the slate date itself are never backfilled here - they are not
          # final when the morning run fires.
          echo "env: ${ENV}"
          ARGS="--env ${ENV} --through-date $(TZ=America/Toronto date -d yesterday +%F)"
          if [ "${DISPATCH_DRY:-false}" == "true" ]; then
            ARGS="${ARGS} --dry"
            echo "dry=true: the backfill step runs READ-ONLY (no upserts)"
          fi
          uv run --frozen python smartscore/scripts/backtrack/backfill_missing_days.py ${ARGS}
      # Prior stages this replaced (both REMOVED from the picks path):
      #  * `dump_store.py --load` (rebuild data/raw_nhl.sqlite from the
      #    committed data/dumps/ dumps) and `refresh_store.py --skip-load`
      #    (incremental NHL crawl of the current season, incl. the
      #    data/cache crawl-cache step). The runner no longer holds or
      #    rebuilds the raw store at all: Supabase IS the live data plane,
      #    the dumps stay the committed backup, and refresh_store.py
      #    survives ONLY as an owner-side offline utility (make
      #    backtrack-refresh) for store maintenance.

      # Artifact source step: the script resolves the artifact in this order
      # (docs/ml-picks-runbook.md §2): --artifact PATH (local file, always
      # wins) -> S3 bucket/prefix (only when ML_S3_BUCKET is configured AND
      # AWS credentials exist) -> Supabase Storage ML_STORAGE_BUCKET/prefix
      # (the DEFAULT here: same SUPABASE_* secrets this job already needs -
      # no AWS at all). If S3 is configured but its secrets are absent, the
      # run falls through to Storage automatically.
      # Steps 3+4: run_daily_picks fetches the artifact (Storage dated-prefix
      # latest by default) then performs inference via model.py + its
      # schema-safe Picks write (save_picks_db) - the same inference path the
      # handler ran.

      # Trigger-source resolution, workflow_dispatch semantics preserved:
      # explicit inputs.date/inputs.dry win; repository_dispatch (the
      # per-game kick, fired from the state machine's KickMLPicks state)
      # supplies client_payload {date, dry, context: 'post-game-start'}.
      # Multiple kicks per date are fine and expected (one per state-machine
      # run): each is one extra idempotent pass - the write is stat_update
      # (the DEFAULT): a read-modify-write per-row PATCH of ONLY the stat
      # column, so a repeat pass for a date re-fills the CURRENT slate
      # (never wipes, never inserts; --write-mode legacy restores the old
      # wipe-then-republish REPLACE).
      # docs/ml-picks-runbook.md ("Per-game kick").
      - name: Run the daily ML picks pass
        env:
          DISPATCH_DATE: ${{ inputs.date || github.event.client_payload.date }}
          DISPATCH_DRY: ${{ inputs.dry || github.event.client_payload.dry }}
          # The WRITE MODE of the Picks step: the dispatch input (default
          # stat_update); scheduled/kicked runs resolve the default here.
          DISPATCH_WRITE_MODE: ${{ inputs.write_mode || 'stat_update' }}
          # WRITE side: the resolved picks env -> Picks-{ENV} (config.ENV).
          ENV: ${{ steps.picks_env.outputs.picks_env }}
          # LIVE-READ side: the resolved source env -> Player-Snapshots-
          # {source_env} via run_daily_picks' --source-env. The backfill
          # (above) and the history reads are NOT source-resolved: the shared
          # -prod ledger is read/written regardless (027ef47).
          SOURCE_ENV: ${{ steps.picks_env.outputs.source_env }}
        run: |
          echo "env: ${ENV}"
          echo "source: ${SOURCE_ENV}"
          # The write env stays ENV (no CLI re-bind: an --env flag would
          # rebind the module-global config.ENV read at import - the hazard
          # the ENV fixture bug warned about); the step-level env IS the
          # bind. --source-env is passed explicitly so the live-read axis is
          # visible in the script's own argv/log; history reads follow the
          # pinned default 'prod'.
          ARGS="--source-env ${SOURCE_ENV} --write-mode ${DISPATCH_WRITE_MODE}"
          # --write-mode stat_update is pinned EXPLICITLY (it is also the
          # script's default) so the argv/log always shows the mode: fill
          # ONLY the stat column on the site's OWN full-slate Picks-{ENV}
          # rows - the site's SaveToDb owns the slate (a full wipe +
          # full-slate reinsert) and this run never wipes or inserts rows;
          # the top-3 challenge picks are log/summary OUTPUT. Legacy
          # (--write-mode legacy) is a manual/local escape hatch only - the
          # site's own flows (NotifyUsers' choose_picks, UpdateHistory) read
          # the FULL slate rows, so a 3-row wipe publication fights them.
          # The script whitelists the value (fail-closed ValueError).
          if [ -n "${DISPATCH_DATE}" ]; then
            ARGS="${ARGS} --date ${DISPATCH_DATE}"
          fi
          if [ "${DISPATCH_DRY}" == "true" ]; then
            ARGS="${ARGS} --dry"
          fi
          echo "Trigger context: ${{ github.event_name }} (date:'${DISPATCH_DATE}' dry:'${DISPATCH_DRY}')"
          uv run --with lightgbm==4.7.0 python smartscore/scripts/backtrack/run_daily_picks.py ${ARGS}

      # Step 5: the script prints the single structured SMARTSCORE_ML_PICKS
      # log line and appends the headline to $GITHUB_STEP_SUMMARY; this step
      # surfaces the run verdict in the job log as well.
      - name: Job summary
        if: always()
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -s "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "ML picks run complete - see the job summary for the headline."
          else
            echo "ML picks run finished (no summary written: the pass did not reach job_summary)."
          fi
