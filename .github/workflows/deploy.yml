name: Lint, Test, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  setup:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      python-version: ${{ steps.setup-python.outputs.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      
      - name: Cache Poetry installation
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-deps-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-deps-${{ runner.os }}-
      
      - name: Install dependencies
        run: poetry install --with dev
      
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            smartscore/Rust/make_predictions/target
          key: rust-build-${{ runner.os }}-${{ hashFiles('smartscore/Rust/make_predictions/Cargo.lock') }}
          restore-keys: |
            rust-build-${{ runner.os }}-
      
      - name: Compile Rust code
        run: make compile
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: |
            smartscore/Rust/make_predictions/target/release/*.dll
            smartscore/Rust/make_predictions/target/release/*.so
            smartscore/Rust/make_predictions/target/release/*.dylib
          retention-days: 1

  lint:
    needs: setup
    runs-on: ubuntu-latest
    if: always() && needs.setup.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      
      - name: Cache Poetry installation
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-deps-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts
      
      - name: Run lint
        run: poetry run make lint

  test:
    needs: setup
    runs-on: ubuntu-latest
    if: always() && needs.setup.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
      
      - name: Cache Poetry installation
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: poetry-deps-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts

      - name: Run tests
        run: make test

  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: |
      needs.lint.result == 'success' && needs.test.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy'))
      )
    outputs:
      env_was_dev: ${{ steps.env-detect.outputs.is_dev }}
    env:
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Detect environment
        id: env-detect
        run: echo "is_dev=${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential  # Install gcc and make
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: poetry install --no-root
      
      - name: Set environment variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_API_KEY=${{ secrets.SUPABASE_API_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV
          echo "BREVO_SMTP_LOGIN=${{ secrets.BREVO_SMTP_LOGIN }}" >> $GITHUB_ENV
          echo "BREVO_SMTP_KEY=${{ secrets.BREVO_SMTP_KEY }}" >> $GITHUB_ENV
          echo "BREVO_FROM_EMAIL=${{ secrets.BREVO_FROM_EMAIL }}" >> $GITHUB_ENV
          echo "FEATURE_SEND_EMAILS=${{ secrets.FEATURE_SEND_EMAILS }}" >> $GITHUB_ENV
          echo "POSTHOG_FEATURE_FLAG_KEY=${{ secrets.POSTHOG_FEATURE_FLAG_KEY }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run deploy script
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chmod +x build_scripts/deploy.sh
          ./build_scripts/deploy.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  dev-integration:
    needs: deploy
    runs-on: ubuntu-latest
    # Only run the mock-NHL integration suite against the dev stack (PRs with
    # the deploy label), never against prod.
    if: |
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.env_was_dev == 'true'
    env:
      ENV: dev
      AWS_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: poetry install --no-root

      - name: Set environment variables
        run: |
          echo "POSTHOG_FEATURE_FLAG_KEY=${{ secrets.POSTHOG_FEATURE_FLAG_KEY }}" >> $GITHUB_ENV
          echo "POSTHOG_PERSONAL_API_KEY=${{ secrets.POSTHOG_PERSONAL_API_KEY }}" >> $GITHUB_ENV
          echo "POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run dev integration tests (mocked NHL)
        run: make integration