name: Lint, Test, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Serialize runs per ref so two concurrent runs never deploy the same stack at
# once (AWS Lambda allows only one in-flight code update per function).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      python-version: ${{ steps.setup-python.outputs.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            smartscore/Rust/make_predictions/target
          key: rust-build-${{ runner.os }}-${{ hashFiles('smartscore/Rust/make_predictions/Cargo.lock') }}
          restore-keys: |
            rust-build-${{ runner.os }}-

      - name: Compile C code
        run: make compile_c

      - name: Compile Rust code (Linux Lambda target)
        run: cargo build --release --target x86_64-unknown-linux-gnu --manifest-path smartscore/Rust/make_predictions/Cargo.toml

      - name: Install compiled Rust module into venv
        run: |
          SITE_PACKAGES=$(find .venv -type d -name site-packages | head -1)
          cp smartscore/Rust/make_predictions/target/x86_64-unknown-linux-gnu/release/libmake_predictions_rust.so \
            "$SITE_PACKAGES/make_predictions_rust.so"
          uv run python -c "import make_predictions_rust; print('make_predictions_rust import OK')"

      - name: Stage build artifacts
        run: |
          mkdir -p build_artifacts/smartscore/Rust/make_predictions/target/x86_64-unknown-linux-gnu/release
          cp smartscore/compiled_code.so build_artifacts/smartscore/compiled_code.so
          cp smartscore/Rust/make_predictions/target/x86_64-unknown-linux-gnu/release/libmake_predictions_rust.so \
            build_artifacts/smartscore/Rust/make_predictions/target/x86_64-unknown-linux-gnu/release/libmake_predictions_rust.so

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-artifacts
          path: build_artifacts/
          if-no-files-found: error
          retention-days: 1

  lint:
    needs: setup
    runs-on: ubuntu-latest
    if: always() && needs.setup.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run lint
        run: uv run make lint

  test:
    needs: setup
    runs-on: ubuntu-latest
    if: always() && needs.setup.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts

      - name: Install compiled Rust module into venv
        run: |
          SITE_PACKAGES=$(find .venv -type d -name site-packages | head -1)
          cp smartscore/Rust/make_predictions/target/x86_64-unknown-linux-gnu/release/libmake_predictions_rust.so \
            "$SITE_PACKAGES/make_predictions_rust.so"

      - name: Run tests
        run: make test

  migrate:
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Same gate as deploy: apply pending migrations to the dev tables for a
    # deploy-labelled PR, to the prod tables on a merge to main.
    if: |
      needs.lint.result == 'success' && needs.test.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy'))
      )
    env:
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Guard migration files
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          status=0
          for file in "${files[@]}"; do
            # An unsubstituted __ENV__ would target a nonexistent table, so
            # check the substituted text rather than the file on disk.
            if sed "s/__ENV__/$ENV/g" "$file" | grep -n '__ENV__' > /dev/null; then
              echo "::error file=$file::Unsubstituted __ENV__ token. Use the plain token in every table name so the migrate step can scope it to $ENV."
              status=1
            fi
            # Checked against the raw file: this is what catches a migration
            # that hardcodes one environment's tables and would silently hit
            # prod during a dev deploy. Quote the table name for the suffix to
            # match, e.g. "Picks-<env>", or use the __ENV__ placeholder.
            if grep -nE '"[^"]*-(dev|prod)"' "$file"; then
              echo "::error file=$file::Hardcoded dev/prod table-name suffix. Write the suffix as the __ENV__ placeholder so CI scopes the migration to $ENV."
              status=1
            fi
          done
          exit $status

      # psql is preinstalled on ubuntu-latest, so no client install step.
      #
      # There is no migration history here: psql applies every file in
      # supabase/migrations/ on every run, so an already-applied migration is a
      # no-op only because it is idempotent. A non-idempotent file (plain ADD
      # COLUMN, an unconditional UPDATE, a CREATE TABLE) would be re-applied on
      # every deploy and fail once the first run landed. Follow-up options:
      # keep every migration idempotent with IF NOT EXISTS / IF EXISTS, or
      # switch to `supabase db push --db-url` with SUPABASE_ACCESS_TOKEN and a
      # project ref, which records applied migrations in a history table.
      - name: Apply migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations in supabase/migrations/; nothing to apply."
            exit 0
          fi
          for file in $(printf '%s\n' "${files[@]}" | sort); do
            echo "Applying $file (ENV=$ENV)"
            sed "s/__ENV__/$ENV/g" "$file" \
              | psql -v ON_ERROR_STOP=1 --single-transaction "$DATABASE_URL"
          done

  deploy:
    needs: [lint, test, migrate]
    runs-on: ubuntu-latest
    if: |
      needs.lint.result == 'success' && needs.test.result == 'success' && needs.migrate.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy'))
      )
    outputs:
      env_was_dev: ${{ steps.env-detect.outputs.is_dev }}
    env:
      ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      DEPLOY_SKIP_BUILD: "1"
    steps:
      - name: Detect environment
        id: env-detect
        run: echo "is_dev=${{ github.ref != 'refs/heads/main' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/setup-uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts

      - name: Set environment variables
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_API_KEY=${{ secrets.SUPABASE_API_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV
          echo "BREVO_SMTP_LOGIN=${{ secrets.BREVO_SMTP_LOGIN }}" >> $GITHUB_ENV
          echo "BREVO_SMTP_KEY=${{ secrets.BREVO_SMTP_KEY }}" >> $GITHUB_ENV
          echo "BREVO_FROM_EMAIL=${{ secrets.BREVO_FROM_EMAIL }}" >> $GITHUB_ENV
          echo "FEATURE_SEND_EMAILS=${{ secrets.FEATURE_SEND_EMAILS }}" >> $GITHUB_ENV
          echo "POSTHOG_FEATURE_FLAG_KEY=${{ secrets.POSTHOG_FEATURE_FLAG_KEY }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run deploy script
        run: |
          chmod +x build_scripts/deploy.sh
          ./build_scripts/deploy.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  dev-integration:
    needs: deploy
    runs-on: ubuntu-latest
    # Only run the mock-NHL integration suite against the dev stack (PRs with
    # the deploy label), never against prod.
    if: |
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.env_was_dev == 'true'
    env:
      ENV: dev
      AWS_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set environment variables
        run: |
          echo "POSTHOG_FEATURE_FLAG_KEY=${{ secrets.POSTHOG_FEATURE_FLAG_KEY }}" >> $GITHUB_ENV
          echo "POSTHOG_PERSONAL_API_KEY=${{ secrets.POSTHOG_PERSONAL_API_KEY }}" >> $GITHUB_ENV
          echo "POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run dev integration tests (mocked NHL)
        run: make integration
