[project]
name = "smartscore"
version = "0.0.2"
description = ""
readme = "README.md"
requires-python = ">=3.12, <3.13"
authors = [{ name = "Nathan Probert", email = "nathanprobert@rogers.com" }]
dependencies = [
    "requests[socks]>=2.32.3,<3.0.0",
    "marshmallow>=3.22.0,<4.0.0",
    "aws-lambda-powertools>=3.0.0,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "smartscore-info-client @ git+https://github.com/nathan-probert/smartscore-info-client.git@v3.0.0",
    "pytz>=2024.2,<2025.0",
    "unidecode>=1.3.8,<2.0.0",
    "supabase>=2.27.0,<3.0.0",
    "beautifulsoup4>=4.12.3,<5.0.0",
    "urllib3>=2.6.3,<3.0.0",
    "numpy>=2.4.1,<3.0.0",
    "cryptography>=46.0.5,<47.0.0",
    "pyjwt>=2.12.1,<3.0.0",
    "filelock>=3.25.2,<4.0.0",
    "virtualenv>=21.2.0,<22.0.0",
    "posthog>=7.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1,<5.0.0",
    "ruff>=0.5.5,<1.0.0",
    "pytest>=8.2.2,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pandas>=3.0.0,<4.0.0",
    "maturin>=1.8.2,<2.0.0",
    "boto3>=1.40.6,<2.0.0",
    "statelint>=2.0.0,<3.0.0",
    "warp-lang>=1.11.0,<2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
exclude = ["**/__pycache__/*", "**/*.pyc", "output/*"]
indent-width = 4
target-version = "py312"
src = ["smartscore", "tests", "templates"]
line-length = 120

[tool.ruff.lint]
select = [
  "BLE",
  "E",
  "F",
  "I",
  "PL",
  "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D",
  "S",
  "PLR2004",
  "ARG001",
  "S101",
  "S105",
]
"smartscore/scripts/*" = [
  "PLR0913", # Too many arguments in function definition
  "PLR0912", # Too many branches
  "PLR0915", # Too many statements
  "PLR2004", # Magic value
  "E741",    # Ambiguous variable name
]
"smartscore/email_utility.py" = ["E501"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["smartscore"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
pythonpath = ["smartscore"]
testpaths = ["tests/unit"]
markers = [
    "integration: runs against the deployed AWS stack and PostHog (opt-in)",
]

[build-system]
requires = ["maturin>=1.2"]
build-backend = "maturin"
